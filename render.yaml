services:
  - type: web
    name: emlytics-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --listen=0.0.0.0:$PORT app:web_app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: EMLYTICS_PUBLIC_DEMO
        value: "1"
